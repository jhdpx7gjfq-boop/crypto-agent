[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igwt-pf26"
version = "0.1.0"
description = "Quant Intelligence OS for crypto decision-making"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Claude Haiku", email = "noreply@anthropic.com"}
]

keywords = [
    "quantitative-research",
    "crypto",
    "market-intelligence",
    "decision-signals",
    "backtesting",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "duckdb>=0.9.0",
    "pyarrow>=13.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pylint>=3.0.0",
]

ml = [
    "optuna>=3.13.0",
    "mlflow>=2.10.0",
    "scikit-learn>=1.3.0",
]

web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
]

notebook = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "plotly>=5.17.0",
]

[project.urls]
Homepage = "https://github.com/jhdpx7gjfq-boop/crypto-agent"
Documentation = "https://github.com/jhdpx7gjfq-boop/crypto-agent/docs"
Repository = "https://github.com/jhdpx7gjfq-boop/crypto-agent.git"

[tool.setuptools]
package-dir = {"" = "."}
packages = [
    "src",
    "src.layers",
    "src.layers.layer1_data",
    "src.layers.layer2_regime",
    "src.layers.layer3_wyckoff",
    "src.layers.layer4_x20",
    "src.layers.layer5_narm",
    "src.layers.layer6_rcm",
    "src.layers.layer7_rrp",
    "src.layers.layer8_optimizer",
    "src.core",
    "src.utils",
    "src.api",
    "tests",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
skip = ["__pycache__"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pylint.messages_control]
disable = ["C0114", "C0115", "C0116"]  # Docstring requirements

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow-running tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

precision = 2
