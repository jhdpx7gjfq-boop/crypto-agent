[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igwt-pf26"
version = "0.1.0-alpha"
description = "IGWT-PF26 Quant Research Infrastructure"
requires-python = ">=3.11"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
dependencies = [
    "requests>=2.31,<3",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "duckdb>=0.9,<1",
    "pyarrow>=14.0,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8",
    "pytest-asyncio>=0.21,<1",
    "pytest-cov>=4.0,<5",
    "mypy>=1.5,<2",
    "ruff>=0.1,<1",
]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C", "ARG", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v --tb=short --cov=src"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]
