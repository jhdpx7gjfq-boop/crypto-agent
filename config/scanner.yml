# IGWT-AIOS Scanner Configuration — P0.1–P0.2

data:
  # Universe configuration (P0.1)
  universe:
    source: coingecko
    max_tokens: 500
    rank_filter: true
    min_rank: 1
    max_rank: 500

  # Binance OHLCV configuration (P0.1)
  binance:
    timeframes:
      - daily
      - 4h
    max_candles_per_fetch: 500
    retry_count: 3
    retry_delay: 1.0
    timeout: 10

  # CoinGecko configuration (P0.1)
  coingecko:
    pagination_size: 250
    retry_count: 3
    retry_delay: 1.0
    timeout: 10

  # Storage (P0.1)
  storage:
    backend: parquet
    data_dir: data
    compression: snappy

# Data validation (P0.1)
validation:
  check_duplicates: true
  check_monotonic_timestamps: true
  check_ohlc_consistency: true
  check_missing_columns: true

# Universe filtering (P0.2) — RESEARCH_CANDIDATE
filters:
  market_cap:
    enabled: true
    min_market_cap: null  # No minimum (accept all available)
    max_market_cap: null  # No maximum
    status: "RESEARCH_CANDIDATE"
    note: "Thresholds not optimized. Adjust as needed for analysis."

  volume_24h:
    enabled: true
    min_volume_24h: null  # No minimum (accept all available)
    status: "RESEARCH_CANDIDATE"
    note: "Minimum not optimized. May adjust for liquidity filtering."

  data_availability:
    enabled: true
    require_daily: true
    require_4h: true
    min_candles_per_timeframe: 50
    status: "RESEARCH_CANDIDATE"
    note: "Minimum candles prevents incomplete histories. P1+ will extend."

  data_quality:
    enabled: true
    check_nan: true
    check_duplicates: true
    check_monotonic: true
    status: "RESEARCH_CANDIDATE"

# Bottom Detector (P0.3) — RESEARCH_CANDIDATE
bottom_detector:
  enabled: true
  drawdown_lookback: 100  # days
  drawdown_threshold: -20  # percent
  base_lookback: 30  # days
  base_range_threshold: 12  # percent
  min_base_candles: 10
  stability_threshold: 30  # percent closes above mid-range
  escape_threshold: -2  # percent below base_low for invalidation
  status: "RESEARCH_CANDIDATE"
  note: "All thresholds are research guesses. Not optimized. Requires PIT/OOS/WFV validation before production."

# Timeframe priorities (P0.1–P0.3 supports daily and 4h)
timeframes:
  daily:
    enabled: true
    purpose: "Context, bottom detection (primary), spring setup"
  4h:
    enabled: true
    purpose: "Confirmation, reclaim, structure"
  # 1h, 15m, 5m are P1+, disabled in P0.1–P0.3
