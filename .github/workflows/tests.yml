name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-dev.txt

      - run: pytest tests/unit/ tests/integration/test_phase9_dashboard_agent.py tests/integration/test_binance_rcm_validation.py tests/test_main.py -v --tb=short
