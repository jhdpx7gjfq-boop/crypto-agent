name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-dev.txt

      - run: pytest -m "not slow" --ignore=tests/test_feature_store.py --ignore=tests/test_dashboard.py --ignore=tests/test_dashboard_governance.py --ignore=tests/integration/test_signal_quality.py --ignore=tests/integration/test_bce_walkforward.py --tb=short
